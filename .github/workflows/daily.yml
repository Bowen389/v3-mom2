name: V3 mom2 daily scan
on:
  push:
    paths:
      - '.github/workflows/daily.yml'
      - 'scan.py'
  schedule:
    # GitHub native schedule; UTC -> Asia/Shanghai 17:00 / 18:00
    - cron: '0 9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '0 13 * * 1-5'  # 盘后兜底补丁新增
    - cron: '30 0 * * 2-6'  # 盘后兜底补丁新增
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive first signal date (YYYY-MM-DD)
        default: '2026-11-01'
      end:
        description: Inclusive last available price date (blank is today)
        default: ''
permissions:
  contents: write
concurrency:
  group: mom2-reports
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install akshare==1.20.65 'exchange-calendars>=4.11,<5'
      - uses: actions/cache/restore@v4
        with:
          path: data/prices
          key: mom2-prices-${{ github.run_id }}
          restore-keys: mom2-prices-
      - run: python -m unittest test_recovery -v
      - name: Scan and replay with Tencent market data
        env:
          START_INPUT: ${{ inputs.start }}
          END_INPUT: ${{ inputs.end }}
        run: |
          args=()
          if [ -n "$START_INPUT" ]; then args+=(--start "$START_INPUT"); fi
          if [ -n "$END_INPUT" ]; then args+=(--end "$END_INPUT"); fi
          python -u scan.py "${args[@]}"
      - name: Publish reports
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -d reports ]; then
            git add reports/
            if ! git diff --cached --quiet; then
              git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish V3 mom2 scan and replay"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/prices/*.csv') != ''
        with:
          path: data/prices
          key: mom2-prices-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mom2-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
