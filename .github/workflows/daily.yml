name: V3 mom2 daily scan
on:
  push:
    paths:
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '13 9 * * 1-5'
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive first signal date (YYYY-MM-DD)
        default: '2026-11-01'
      end:
        description: Inclusive last available price date (blank is today)
        default: ''
permissions:
  contents: write
concurrency:
  group: mom2-reports
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install akshare==1.20.63
      - name: Scan and replay with Tencent daily prices
        env:
          START_INPUT: ${{ inputs.start }}
          END_INPUT: ${{ inputs.end }}
        run: |
          export TZ=Asia/Shanghai
          today=$(date +%F)
          if [ "$GITHUB_EVENT_NAME" = push ]; then START_INPUT=2026-11-01; END_INPUT=2026-11-15; fi
          start=${START_INPUT:-$(date -d '10 days ago' +%F)}
          end=${END_INPUT:-$today}
          python scan.py --start "$start" --end "$end"
      - name: Publish reports
        run: |
          if [ -d reports ]; then
            git add reports/
            if ! git diff --cached --quiet; then
              git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish V3 mom2 scan and replay"
              git push
            fi
          fi
